
# ==========================================
# APPLICATION CONFIGURATION
# ==========================================
spring.application.name=carbontrack-backend

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/${MYSQL_DATABASE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# FLYWAY DATABASE MIGRATION
# ==========================================
spring.flyway.enabled=true
spring.flyway.url=${SPRING_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${SPRING_FLYWAY_USER:${MYSQL_USER}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${MYSQL_PASSWORD}}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ==========================================
# REDIS CONFIGURATION
# ==========================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8080

# ==========================================
# JWT SECURITY CONFIGURATION
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# ==========================================
# EMAIL CONFIGURATION - GMAIL SMTP
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================================
# OTP CONFIGURATION
# ==========================================
app.password-reset.otp-expiration-minutes=5
app.password-reset.max-attempts=5
app.password-reset.reset-token-expiration-minutes=10

# ==========================================
# GOOGLE OAUTH2 CONFIGURATION
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ==========================================
# OAUTH2 FRONTEND REDIRECT
# ==========================================
app.oauth2.authorized-redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173/login}
